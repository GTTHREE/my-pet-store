<!DOCTYPE html>
<html>

<head>
    <title>PAWORA</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <header>

        <div class="logo">
            🐾 PAWORA
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#" onclick="showCart()">🛒 Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>


    <section class="hero">

        <h1>Better Products for Happier Pets</h1>

        <p>Premium products designed for pets and their owners.</p>

        <button>Shop Now</button>

    </section>


    <section class="products">

        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="product">
                <img class="product-photo" src="dog-bowl.jpg" alt="Premium Dog Bowl">
                <h3>Premium Dog Bowl</h3>
                <p>$29.99</p>
                <button onclick="addToCart('Premium Dog Bowl', 29.99)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">🐱</div>
                <h3>Cozy Cat Bed</h3>
                <p>$49.99</p>
                <button onclick="addToCart('Cozy Cat Bed', 49.99)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <div class="product-image">🐕</div>
                <h3>Pet Travel Bag</h3>
                <p>$39.99</p>
                <button onclick="addToCart('Pet Travel Bag', 39.99)">
                    Add to Cart
                </button>
            </div>

        </div>

    </section>
    <div id="cart-drawer" class="cart-drawer">

    <div class="cart-header">
        <h2>Your Cart</h2>
        <button onclick="closeCart()">×</button>
    </div>

    <div id="cart-items">
        <p>Your cart is empty.</p>
    </div>

    <div class="cart-footer">
        <h3>Total: $<span id="cart-total">0.00</span></h3>
        <button>Checkout</button>
    </div>

</div>
    <script src="script.js"></script>
</body>

</html>
