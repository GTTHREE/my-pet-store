<!DOCTYPE html>
<html>

<head>
    <title>PAWORA</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f5f0;
            color: #333;
        }

        header {
            background-color: white;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #333;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            color: #666;
        }

        button {
            margin-top: 25px;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .products {
            padding: 70px 60px;
            text-align: center;
            background-color: white;
        }

        .products h2 {
            font-size: 36px;
            margin-bottom: 40px;
        }

        .product-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .product {
            width: 280px;
            padding: 25px;
            border-radius: 15px;
            background-color: #f8f5f0;
        }

       .product-photo {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
}

        .product h3 {
            font-size: 20px;
        }

        .product p {
            font-size: 18px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <header>

        <div class="logo">
            🐾 PAWORA
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">🛒 Cart (<span id="cart-count">0</span>)</a>

    </header>


    <section class="hero">

        <h1>Better Products for Happier Pets</h1>

        <p>Premium products designed for pets and their owners.</p>

        <button>Shop Now</button>

    </section>


    <section class="products">

        <h2>Featured Products</h2>

        <div class="product-container">

            <div class="product">
                <img class="product-photo" src="dog-bowl.jpg" alt="Premium Dog Bowl">
                <h3>Premium Dog Bowl</h3>
                <p>$29.99</p>
                <button onclick="addToCart()">Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">🐱</div>
                <h3>Cozy Cat Bed</h3>
                <p>$49.99</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <div class="product-image">🐕</div>
                <h3>Pet Travel Bag</h3>
                <p>$39.99</p>
                <button>Add to Cart</button>
            </div>

        </div>

    </section>
    <script>
    let cartCount = 0;

    function addToCart() {
        cartCount = cartCount + 1;

        document.getElementById("cart-count").textContent = cartCount;
    }
    </script>
</body>

</html>
